name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t student-founder-api:ci backend
      - run: docker build -t student-founder-web:ci frontend

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_founder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_founder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Diagnose RLS insert
        run: |
          set +e
          python - <<'PY' > diag.log 2>&1
          import os, uuid
          from sqlalchemy import create_engine, text
          u = str(uuid.uuid4())
          e = create_engine(os.environ['DATABASE_URL'])
          with e.connect() as conn:
              tx = conn.begin()
              uid = str(uuid.uuid4())
              conn.execute(text("INSERT INTO users (id, email, full_name) VALUES (:i, 'diag2@example.com', 'Diag')"), {"i": uid})
              conn.execute(text(f"SET LOCAL app.user_id = '{uid}'"))
              conn.execute(text("SET LOCAL app.org_id = ''"))
              conn.execute(text("SET LOCAL app.role = 'student'"))
              conn.execute(text("SET LOCAL ROLE app_role"))
              print("whoami:", conn.execute(text("SELECT current_user, session_user, current_setting('app.user_id', true)")).first())
              print("expr-check:", conn.execute(text("SELECT :o = current_setting('app.user_id')::uuid"), {"o": uid}).fetchone()[0])
              print("policies:", conn.execute(text(
                  "SELECT c.relname, p.polname, p.polcmd, "
                  "pg_get_expr(p.polqual, p.polrelid) AS using_expr, "
                  "pg_get_expr(p.polwithcheck, p.polrelid) AS withcheck_expr "
                  "FROM pg_policy p JOIN pg_class c ON c.oid = p.polrelid "
                  "WHERE c.relname IN ('projects','users','evidence_items','messages')"
              )).fetchall())
              try:
                  r = conn.execute(text("INSERT INTO projects (owner_id, title, entry_type) VALUES (:o, 'diag', 'idea') RETURNING id"), {"o": uid}).first()
                  print("INSERT OK", r)
                  conn.execute(text("DELETE FROM projects WHERE owner_id = :o"), {"o": uid})
              except Exception as ex:
                  print("INSERT FAIL:", type(ex).__name__, str(ex))
              tx.rollback()
          PY
          code=$?
          if [ "$code" -ne 0 ] || grep -q "INSERT FAIL" diag.log; then
            python - <<'PY'
          import base64
          data = open('diag.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - name: Run db tests
        run: |
          set +e
          python -m pytest tests/test_db.py tests/test_auth_api.py -q --tb=short > pytest-db.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import base64
          data = open('pytest-db.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - run: alembic downgrade base && alembic upgrade head
