name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t student-founder-api:ci backend
      - run: docker build -t student-founder-web:ci frontend

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_founder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_founder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Run db tests
        run: |
          set +e
          python -m pytest tests/test_db.py tests/test_auth_api.py -q --tb=short > pytest-db.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import base64
          data = open('pytest-db.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - name: Migrate round-trip
        run: |
          set +e
          alembic downgrade base && alembic upgrade head > migrate.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import base64
          data = open('migrate.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
