name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t student-founder-api:ci backend
      - run: docker build -t student-founder-web:ci frontend

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_founder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_founder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Diagnose RLS insert
        run: |
          set +e
          python - <<'PY' > diag.log 2>&1
          import os, uuid
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ['DATABASE_URL'])

          def run(label, body):
              with e.connect() as conn:
                  tx = conn.begin()
                  try:
                      result = body(conn)
                      print(f"[{label}] OK ->", result)
                  except Exception as ex:
                      print(f"[{label}] FAIL:", type(ex).__name__, str(ex).splitlines()[0])
                  tx.rollback()

          uid = str(uuid.uuid4())
          with e.connect() as conn:
              tx = conn.begin()
              conn.execute(text("INSERT INTO users (id, email, full_name) VALUES (:i, 'diag4@example.com', 'Diag')"), {"i": uid})
              conn.execute(text("""CREATE OR REPLACE FUNCTION app_current_user_id() RETURNS uuid
                LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public AS $fn$
                SELECT NULLIF(current_setting('app.user_id', true), '')::uuid $fn$"""))
              conn.execute(text("GRANT EXECUTE ON FUNCTION app_current_user_id() TO app_role"))
              variants = {
                "P1-wcc-true": "true",
                "P2-inline-eq-uid": f"current_setting('app.user_id', true) = '{uid}'::text",
                "P3-owner-eq-definer": "owner_id = app_current_user_id()",
                "P4-orig-inline": "owner_id = current_setting('app.user_id')::uuid OR EXISTS (SELECT 1 FROM project_members pm WHERE pm.project_id = id AND pm.user_id = current_setting('app.user_id')::uuid)",
                "P5-orig-definer": "owner_id = app_current_user_id() OR EXISTS (SELECT 1 FROM project_members pm WHERE pm.project_id = id AND pm.user_id = app_current_user_id())",
              }
              for name, wcc in variants.items():
                  sp = conn.begin_nested()
                  try:
                      conn.execute(text(f"SET LOCAL app.user_id = '{uid}'"))
                      conn.execute(text("SET LOCAL app.org_id = ''"))
                      conn.execute(text("SET LOCAL app.role = 'student'"))
                      conn.execute(text("SET LOCAL ROLE app_role"))
                      conn.execute(text("DROP POLICY projects_member_access ON projects"))
                      conn.execute(text("""CREATE POLICY projects_member_access ON projects
                        USING (is_project_member(id))
                        WITH CHECK (%s)""" % wcc))
                      r = conn.execute(text("INSERT INTO projects (owner_id, title, entry_type) VALUES (:o, 'diag', 'idea') RETURNING id"), {"o": uid}).first()
                      print(f"[{name}] OK ->", r[0])
                      sp.commit()
                  except Exception as ex:
                      print(f"[{name}] FAIL:", type(ex).__name__, str(ex).splitlines()[0])
                      sp.rollback()
              tx.rollback()
          print("done")
          PY
          code=$?
          python - <<'PY'
          import base64
          data = open('diag.log', 'rb').read()
          print('::error::DBTEST-DIAG:' + base64.b64encode(data[-8000:]).decode())
          PY
          exit $code
      - name: Run db tests
        run: |
          set +e
          python -m pytest tests/test_db.py tests/test_auth_api.py -q --tb=short > pytest-db.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import base64
          data = open('pytest-db.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - run: alembic downgrade base && alembic upgrade head
