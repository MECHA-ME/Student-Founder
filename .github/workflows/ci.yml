name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t student-founder-api:ci backend
      - run: docker build -t student-founder-web:ci frontend

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_founder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_founder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Diagnose RLS insert
        run: |
          set +e
          python - <<'PY' > diag.log 2>&1
          import os, uuid
          from sqlalchemy import create_engine, text
          u = str(uuid.uuid4())
          e = create_engine(os.environ['DATABASE_URL'])

          def try_insert(label, uid, setup):
              with e.connect() as conn:
                  tx = conn.begin()
                  conn.execute(text("INSERT INTO users (id, email, full_name) VALUES (:i, 'diag3@example.com', 'Diag')"), {"i": uid})
                  setup(conn, uid)
                  guc = conn.execute(text("SELECT current_setting('app.user_id', true)")).fetchone()[0]
                  print(f"{label} guc={guc} user={conn.execute(text('select current_user')).fetchone()[0]}")
                  try:
                      r = conn.execute(text("INSERT INTO projects (owner_id, title, entry_type) VALUES (:o, 'diag', 'idea') RETURNING id"), {"o": uid}).first()
                      print(f"{label} INSERT OK", r)
                  except Exception as ex:
                      print(f"{label} INSERT FAIL:", type(ex).__name__, str(ex))
                  tx.rollback()

          uid_a = str(uuid.uuid4())
          def setup_a(c, uid):
              c.execute(text(f"SET LOCAL app.user_id = '{uid}'"))
              c.execute(text("SET LOCAL app.org_id = ''"))
              c.execute(text("SET LOCAL app.role = 'student'"))
              c.execute(text("SET LOCAL ROLE app_role"))
          try_insert("A-local-then-role", uid_a, setup_a)

          uid_b = str(uuid.uuid4())
          def setup_b(c, uid):
              c.execute(text("SET LOCAL ROLE app_role"))
              c.execute(text(f"SET LOCAL app.user_id = '{uid}'"))
              c.execute(text("SET LOCAL app.org_id = ''"))
              c.execute(text("SET LOCAL app.role = 'student'"))
          try_insert("B-role-then-local", uid_b, setup_b)

          uid_c = str(uuid.uuid4())
          def setup_c(c, uid):
              c.execute(text(f"SET app.user_id = '{uid}'"))
              c.execute(text("SET app.org_id = ''"))
              c.execute(text("SET app.role = 'student'"))
              c.execute(text("SET LOCAL ROLE app_role"))
          try_insert("C-session-set", uid_c, setup_c)
          PY
          code=$?
          if [ "$code" -ne 0 ] || grep -q "INSERT FAIL" diag.log; then
            python - <<'PY'
          import base64
          data = open('diag.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - name: Run db tests
        run: |
          set +e
          python -m pytest tests/test_db.py tests/test_auth_api.py -q --tb=short > pytest-db.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import base64
          data = open('pytest-db.log', 'rb').read()
          print('::error::DBTEST-B64:' + base64.b64encode(data[-2500:]).decode())
          PY
          fi
          exit $code
      - run: alembic downgrade base && alembic upgrade head
